services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Cria o segundo banco (animehub_test) usado pela suíte Playwright —
      # só roda na primeira inicialização do volume acima.
      - ./docker/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    ports:
      # Só localhost — não expõe o Postgres (senha fixa, só p/ dev local)
      # pra outros dispositivos na mesma rede.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Job único de migração — roda `prisma migrate deploy` e sai. Separado do
  # `web` pra não rodar migração a cada boot/replica e pra manter a imagem
  # do `web` (stage runner) enxuta, sem a CLI da Prisma nem devDependencies.
  migrate:
    build:
      context: .
      target: builder
    command: npx prisma migrate deploy
    environment:
      ANIME_HUB_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      ANIME_HUB_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      KITSU_API_BASE_URL: ${KITSU_API_BASE_URL}
      ANIDB_CLIENT_NAME: ${ANIDB_CLIENT_NAME}
      ANIDB_CLIENT_VERSION: ${ANIDB_CLIENT_VERSION}
      DISABLE_OTHER_SOURCES: ${DISABLE_OTHER_SOURCES}
      # Não obrigatório — sem isso (ou se a chamada falhar), as rotas caem
      # pro caminho local de sempre (ver src/lib/serviceDelegate.ts).
      CACHE_UPDATER_URL: http://cache-updater:4003
      # Serviço secundário de notícias da temporada (Admin → Scrapers → "Buscar
      # notícias"); sem ele (ou fora do ar) o painel roda a busca no próprio `web`.
      NEWS_FETCHER_URL: http://news-fetcher:4005
      # Usado só pelo fallback local de /refresh-anime (src/lib/refreshAnimeData.ts)
      # quando o cache-updater está fora do ar mas o name-resolver não está.
      NAME_RESOLVER_URL: http://name-resolver:4002
    ports:
      - "3000:3000"
    volumes:
      # Upload real de imagem (Epic 26) — sem volume aqui, todo upload
      # seria perdido no próximo restart/rebuild (o resto da imagem é
      # baked no build, ver Dockerfile). `storage/uploads`, não
      # `public/uploads` — `next start` não serve dinamicamente um
      # arquivo criado em `public/` depois que o servidor já subiu (só
      # o que já existia no boot), então os arquivos são servidos de
      # volta por uma rota própria (GET /api/uploads/[...path]) em vez
      # do serving estático embutido do Next.
      - uploads_data:/app/storage/uploads
    depends_on:
      # Só espera o migrate — nenhum dos serviços abaixo é obrigatório pro
      # `web` subir: cada rota que dependeria deles tem fallback pro código
      # local (ver Epic 13 no roadmap), então a ordem de início entre eles
      # não importa.
      migrate:
        condition: service_completed_successfully

  # Mantém AiringScheduleEntry quente sozinho (a cada 30min) — o `web` só lê
  # essa tabela agora (src/app/api/calendar/route.ts), nunca busca na AniList
  # direto. Sem HTTP API própria além de /health (nada chama esse serviço
  # sob demanda, é um escritor de fundo puro).
  calendar-loader:
    build:
      context: .
      dockerfile: services/calendar-loader/Dockerfile
    restart: unless-stopped
    environment:
      ANIME_HUB_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4001/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Computação pura de identidade (série/temporada, fusão de gêneros, título
  # por idioma da AniDB, dedup de catálogo) e furigana — sem banco próprio.
  # Chamado pelo endpoint refresh-anime do cache-updater (e pelo fallback
  # local do `web`, se o cache-updater estiver fora do ar).
  name-resolver:
    build:
      context: .
      dockerfile: services/name-resolver/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4002/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Endpoints sob demanda que hoje o BFF chamava direto (busca, temporada,
  # resolver anime pra adicionar à lista, garantir episódios, atualizar
  # dados) — cada rota do `web` tenta chamar aqui primeiro e cai pro código
  # local se este serviço estiver fora do ar (ver serviceDelegate.ts). Os 5
  # endpoints já estão migrados: search, season, resolve-anime,
  # ensure-episodes, refresh-anime.
  cache-updater:
    build:
      context: .
      dockerfile: services/cache-updater/Dockerfile
    restart: unless-stopped
    environment:
      ANIME_HUB_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      KITSU_API_BASE_URL: ${KITSU_API_BASE_URL}
      ANIDB_CLIENT_NAME: ${ANIDB_CLIENT_NAME}
      ANIDB_CLIENT_VERSION: ${ANIDB_CLIENT_VERSION}
      DISABLE_OTHER_SOURCES: ${DISABLE_OTHER_SOURCES}
      # refresh-anime chama o name-resolver pra fusão de gêneros/escolha de
      # título; cai pro cálculo local (src/lib/identityResolution.ts) se
      # este serviço estiver fora do ar.
      NAME_RESOLVER_URL: http://name-resolver:4002
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4003/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Detecta favoritos no ar agora (Epic 10) — a cada ~2min, junta Anime x
  # AiringScheduleEntry por anilistId dentro de uma janela de exibição e
  # grava em AiringAlert. O `web` só lê essa tabela (GET /api/notifications),
  # nunca chama este serviço sob demanda — escritor de fundo puro, como o
  # calendar-loader.
  notifier:
    build:
      context: .
      dockerfile: services/notifier/Dockerfile
    restart: unless-stopped
    environment:
      ANIME_HUB_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4004/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Notícias sobre as obras da temporada atual (Jikan/MyAnimeList), exibidas na
  # Comunidade → Notícias. Chamado pelo painel (POST /run) e uma vez por dia; o
  # `web` só lê a tabela AnimeNews.
  news-fetcher:
    build:
      context: .
      dockerfile: services/news-fetcher/Dockerfile
    restart: unless-stopped
    environment:
      ANIME_HUB_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4005/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  uploads_data:
