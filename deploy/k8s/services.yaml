# Serviços de fundo (Epic 13). Nenhum é obrigatório para o site subir: cada rota cai no código local se o serviço
# estiver fora do ar (src/lib/serviceDelegate.ts).
---
# Mantém o calendário (AiringScheduleEntry) quente sozinho, a cada 30 min.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calendar-loader
  namespace: animehub
spec:
  replicas: 1
  selector:
    matchLabels: { app: calendar-loader }
  template:
    metadata:
      labels: { app: calendar-loader }
    spec:
      containers:
        - name: calendar-loader
          image: animehub/calendar-loader:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 4001
          env:
            - name: PORT
              value: "4001"
          envFrom:
            - secretRef:
                name: animehub-env
          readinessProbe:
            httpGet: { path: /health, port: 4001 }
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            # Só confere que o processo responde: o /health do calendar-loader fica 503 quando a AniList falha, e isso
            # não deve reiniciar o pod.
            tcpSocket: { port: 4001 }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: calendar-loader
  namespace: animehub
spec:
  selector: { app: calendar-loader }
  ports:
    - port: 4001
      targetPort: 4001
---
